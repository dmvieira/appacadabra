# Requires: support@appacadabra.ai added to emulator (Settings → Accounts → Google)
# Requires: setup-device.js run first (clean state, app pre-launched)
appId: ai.appacadabra.app
---
- launchApp:
    stopApp: false
# Wait for home screen — "MANA GRÁTIS" text check would fail here, use label tap below
# tapOn with label retries until element visible (up to ~3s by default)
- tapOn:
    label: "Opções"
    optional: true  # skip if it took too long, next step will reveal if not ready
- launchApp:
    stopApp: false

# --- OPEN MANASHOP ---
- tapOn:
    label: "Mana"
# Wait for ManaShop to open — "MANA GRÁTIS" section is plain text (no emoji), reliable check
- extendedWaitUntil:
    visible: "MANA GRÁTIS"
    timeout: 15000

# --- LOGIN ---
# Ver Anuncio (Mana) opens login prompt when isAnonymous=true
- tapOn:
    label: "Ver Anuncio (Mana)"
# Login prompt now showing — "Entrar com Google" button has accessibilityLabel="Entrar com Google"
# Wait for button text to appear (text match works, no emoji in button accessibilityLabel)
- extendedWaitUntil:
    visible: "Entrar com Google"
    timeout: 15000
- tapOn:
    label: "Entrar com Google"
# Google account picker opens — wait for email text (plain text in native Android UI)
- extendedWaitUntil:
    visible: "support@appacadabra.ai"
    timeout: 30000
- tapOn: "support@appacadabra.ai"
# "Continuar"/"Continue" confirmation may appear on some Android versions
- runFlow:
    when:
      visible: "Continuar"
    commands:
      - tapOn: "Continuar"
# Wait for login to complete — email appears as text in ManaShop account chip
- extendedWaitUntil:
    visible: "support@appacadabra.ai"
    timeout: 45000
# Close ManaShop
- tapOn:
    label: "Fechar"
# First login triggers BackupSyncModal — skip it
- tapOn: "Ignorar backup"

# --- LOGOUT ---
- tapOn: "⋮"
- assertVisible: "Avançado"
- tapOn: "Avançado"
- extendedWaitUntil:
    visible: "Sair da conta"
    timeout: 15000
- tapOn: "Sair da conta"
- assertVisible: "Manter no celular"
- tapOn: "Manter no celular"
- assertVisible: "Você saiu"
- assertNotVisible: "Manter no celular"
