appId: ai.appacadabra.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      label: "Opções"
    timeout: 300000
- tapOn: "⋮"
- assertVisible: "Relatar bug"
- tapOn: "Relatar bug"
- assertVisible: "Relatar um bug"
- tapOn:
    text: "Descreva o problema..."
- inputText: "E2E test: validando fluxo de relato de bug"
- tapOn: "Enviar"
- assertNotVisible: "Relatar um bug"
# Email compose may have opened — bring app back to foreground
- launchApp:
    stopApp: false
- hideKeyboard
- extendedWaitUntil:
    visible: "Appacadabra"
    timeout: 90000
