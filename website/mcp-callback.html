<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Appacadabra — Voltando ao app…</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0A0A1A;
    color: #EDEDF5;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    text-align: center;
  }
  .box { max-width: 420px; padding: 24px; }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  p { font-size: 14px; color: #8b8aad; margin: 0 0 20px; line-height: 1.5; }
  a {
    display: inline-block;
    background: #7C3AED;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 12px;
  }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🪄</div>
  <h1>Returning to Appacadabra…</h1>
  <p id="msg">If nothing happens, tap the button below to go back to the app.</p>
  <a id="fallback" href="appacadabra://mcp-callback">Open Appacadabra</a>
</div>
<script>
  // OAuth relay: forwards authorization-response params from this https URL
  // to the app's custom scheme. Required by servers (e.g. PicPay) that only
  // accept https redirect_uris for dynamic client registration.
  (function () {
    var target = 'appacadabra://mcp-callback' + location.search + location.hash;
    var link = document.getElementById('fallback');
    link.href = target;
    setTimeout(function () { location.replace(target); }, 150);
  })();
</script>
</body>
</html>
