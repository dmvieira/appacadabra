# Runs on every PR to main and every push to main.
# Deliberately excludes Maestro E2E (npm run test:e2e) — requires an Android emulator
# and is not appropriate for GitHub-hosted Linux runners. Run those locally.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Jest (app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest
        run: npm test -- --ci --reporters=default

  typecheck:
    name: TypeScript (non-blocking baseline)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: tsc --noEmit
        run: npx tsc --noEmit

  functions-test:
    name: Jest (firebase/functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --ci --reporters=default

  secret-scan:
    name: Secret sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for obvious secrets
        shell: bash
        run: |
          set -eo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            range="$base..$head"
          else
            range="HEAD~1..HEAD"
          fi

          # Never allowed: keystores, service accounts, google-services payloads.
          hard_patterns='(google-services\.json|-----BEGIN [A-Z ]*PRIVATE KEY-----|serviceAccountKey\.json|\.keystore|\.jks)'
          # Suspicious but sometimes false-positive: API-key-shaped strings.
          soft_patterns='(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_\-]{35}|xox[baprs]-[A-Za-z0-9-]{10,})'

          diff="$(git diff "$range" -- . ':(exclude)package-lock.json' ':(exclude)firebase/functions/package-lock.json' || true)"

          if echo "$diff" | grep -EnI "$hard_patterns"; then
            echo "::error::Hard-blocked secret pattern found in diff. Review the matches above."
            exit 1
          fi

          if echo "$diff" | grep -EnI "$soft_patterns"; then
            echo "::warning::Possible API-key-shaped string in diff. If this is a placeholder or fixture, ignore. Otherwise rotate the key."
          fi

          echo "Secret sweep clean."
