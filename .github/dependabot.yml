version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Expo / React Native ecosystem is pinned tightly to Expo SDK — bump these manually.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: react-test-renderer
      - dependency-name: '@react-native-*'
      # Native modules coupled to the Expo SDK / RN version. A standalone major
      # bump can break the Android/iOS native build without CI catching it (CI
      # only runs Jest) — bump manually alongside the SDK and validate with a
      # device build (android/_build2.bat).
      - dependency-name: react-native-screens
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-nitro-modules
      - dependency-name: react-native-view-shot
      # Native (Nitro-based) module coupled to the Expo SDK / RN version and
      # to react-native-nitro-modules — same policy as the other native modules.
      - dependency-name: react-native-health-connect
      # jest-expo preset must match the Expo SDK major — bump together with the
      # SDK migration, never standalone.
      - dependency-name: jest-expo

  - package-ecosystem: npm
    directory: /firebase/functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - functions
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # TS 7 is the native-port rewrite; ts-jest / firebase tooling is not
      # ready. Bump manually after validating the toolchain.
      - dependency-name: typescript
      # Production runtime frameworks — majors must be validated with an
      # emulator/deploy before landing, so CI's Jest run alone can't clear
      # them. Minors/patches keep flowing through the group PR.
      - dependency-name: firebase-admin
        update-types: ["version-update:semver-major"]
      - dependency-name: firebase-functions
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
      include: scope
